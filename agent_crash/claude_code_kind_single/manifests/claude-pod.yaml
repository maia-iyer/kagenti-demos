apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-crash-demo
  labels:
    app: claude-crash-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claude-crash-demo
  template:
    metadata:
      labels:
        app: claude-crash-demo
    spec:
      containers:
        - name: claude
          image: localhost/claude-crash-demo:local
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: HOME
              value: /root
            - name: ANTHROPIC_API_KEY
              value: ""
          volumeMounts:
            - name: claude-home
              mountPath: /root/.claude
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: claude-home
          emptyDir: {}
        - name: workspace
          emptyDir: {}
